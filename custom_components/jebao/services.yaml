set_schedule:
  target:
    entity:
      integration: jebao
      domain: switch
  fields:
    slots:
      required: true
      example: >-
        [{"start": "08:00", "end": "20:00", "mode": "run", "speed": 70},
         {"start": "20:00", "end": "08:00", "mode": "run", "speed": 40}]
      selector:
        object:
    enable:
      required: false
      selector:
        boolean:

set_cycle:
  target:
    entity:
      integration: jebao
      domain: switch
  fields:
    normal_speed:
      required: false
      example: 60
      selector:
        number:
          min: 30
          max: 100
    run_minutes:
      required: false
      example: 10
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: min
    pause_speed:
      required: false
      example: 0
      selector:
        number:
          min: 0
          max: 100
    pause_seconds:
      required: false
      example: 10
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: s
    boost_speed:
      required: false
      example: 100
      selector:
        number:
          min: 30
          max: 100
    boost_seconds:
      required: false
      example: 30
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: s
    enable:
      required: false
      selector:
        boolean:
